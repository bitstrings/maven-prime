mavenprime.sharedContext=Apply the build context declared in {0}
mavenprime.sharedContext.hint=With this on, the profiles, properties, environment and Force Clean that {0} declares apply to this project, and anything you set yourself overrides them. With it off, only your own values apply and the file''s build context is ignored; the goals it declares still load. Values you edit while it is off become your own - use Reset to Defaults to go back to the team''s.
mavenprime.autoRefresh.hint=A profile, property or environment change alters the effective model. With this on, Maven Prime reloads the Maven project and re-reads the model in the background. With it off, neither happens until you use Refresh.
